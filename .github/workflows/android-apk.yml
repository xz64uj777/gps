name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANE_GPS_VERSION_CODE: ${{ github.run_number }}
      LANE_GPS_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable development debug signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lane-gps-debug-keystore-v1

      - name: Ensure stable development debug signing key
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Lane GPS Development,O=Lane GPS,C=US"
          fi

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Run lane-engine tests
        working-directory: android
        run: gradle :lane-engine:test --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lane-gps-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
