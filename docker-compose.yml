services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: gps
      POSTGRES_USER: gps
      POSTGRES_PASSWORD: gps
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gps -d gps"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://gps:gps@db:5432/gps
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
